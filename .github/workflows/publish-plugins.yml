name: Publish Arabic Plugins

on:
  push:
    branches: [master]
    paths:
      - 'plugins/arabic/**'
      - 'plugins/multisrc/**'
      - 'public/static/**'
      - 'scripts/arabic/**'
      - 'scripts/terser.js'
      - 'scripts/languages.js'
      - 'tsconfig*.json'
      - 'package*.json'
      - '.github/workflows/publish-plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-plugin-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'chunma-san/lnreader-arabic-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:arabic
      - run: npm run build:arabic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arabic-feed
          path: .arabic-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arabic-feed
          path: feed
      - name: Publish the verified Arabic catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$(node -p "require('./feed/build-info.json').branch")"
          [[ "$branch" =~ ^plugins/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git init publication
          cd publication
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth=1 origin "$branch"
            git checkout -b feed FETCH_HEAD
            git rm -r --ignore-unmatch .
          else
            git checkout --orphan feed
          fi
          cp -a ../feed/. .
          git add -f .dist .js public LICENSE README.md build-info.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(arabic): publish validated plugin catalog'
          git push origin "HEAD:$branch"
